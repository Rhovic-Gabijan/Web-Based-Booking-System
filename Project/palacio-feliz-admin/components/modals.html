<!-- Add Package Modal -->
<div class="modal fade" id="addPackageModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Package</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addPackageForm" onsubmit="addPackage(event)">
                    <div class="form-group">
                        <label class="form-label">Package Name</label>
                        <input type="text" class="form-control" id="packageName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="packageDesc" rows="3" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Price (₱)</label>
                                <input type="number" class="form-control" id="packagePrice" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label">Duration (Hours)</label>
                                <input type="number" class="form-control" id="packageDuration" required>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-gold w-100">Add Package</button>
                </form>
            </div>
        </div>
    </div>
</div>
